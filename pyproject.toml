[project]
name = "twitter-network"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Lucas V. Resende", email = "lucasvieiraresende@gmail.com" }]
dependencies = [
  "marimo[lsp]>=0.25.0",
  "matplotlib>=3.11.2",
  "networkx>=3.7",
  "pandas>=3.0.6",
  "pillow>=12.3.0",
  "polars>=1.44.2",
  "pyarrow>=25.0.1",
  "rustworkx>=0.18.1",
  "scipy>=1.18.1",
]

[project.scripts]
twitter-network = "twitter_network:main"

[dependency-groups]
dev = [
  "altair>=6.3.0",
  "duckdb>=1.5.5",
  "marimo-lens>=0.2.0",
  "mcp>=2.0.0",
  "nbformat>=5.11.1",
  "openai>=3.19.2",
  "polars[pyarrow]>=1.44.2",
  "pyrefly>=1.3.2",
  "pytest>=9.1.1",
  "python-lsp-ruff>=2.3.4",
  "python-lsp-server>=1.15.0",
  "ruff>=0.16.9",
  "sqlglot>=30.20.0",
  "vegafusion>=2.0.3",
  "vl-convert-python>=1.9.0.post1",
  "websockets>=17.1",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.marimo.language_servers.pyrefly]
enabled = true

[tool.marimo.diagnostics]
enabled = true

[tool.pyrefly]
python-version = "3.14"
